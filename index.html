<style>
:root{--bg:#000;--card:rgba(255,255,255,.06);--cardg:linear-gradient(145deg,rgba(255,255,255,.1),rgba(255,255,255,.03));--dlg:rgba(44,44,46,.72);--fld:rgba(255,255,255,.1);--tx:#fff;--mu:#9a9aa1;--ac:#0a84ff;--on:#fff;--bad:#ff453a;--good:#5eb0ff;--ln:rgba(255,255,255,.14);--trk:rgba(255,255,255,.16);--navbg:rgba(28,28,30,.1);--navic:rgba(255,255,255,.9);--navon:#fff;--navonic:#0b0b0f;--navtm:rgba(255,255,255,.09);--bubble:#2a2a2e;--glow1:rgba(10,132,255,.4);--glow2:rgba(94,92,230,.28);--hump:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 112 26' preserveAspectRatio='none'><path d='M0 26C20 26 26 0 56 0s36 26 56 26z' fill='%231c1c1e' fill-opacity='.94'/></svg>");color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-mode="light"]{--bg:#f2f2f7;--card:rgba(255,255,255,.5);--cardg:linear-gradient(145deg,rgba(255,255,255,.8),rgba(255,255,255,.4));--dlg:rgba(250,250,252,.8);--fld:rgba(118,118,128,.12);--tx:#0b0b0f;--mu:#6c6c72;--ac:#007aff;--bad:#ff3b30;--good:#0a63d6;--ln:rgba(0,0,0,.08);--trk:rgba(0,0,0,.1);--navbg:rgba(255,255,255,.12);--navic:#2c2c2e;--navon:#111;--navonic:#fff;--navtm:rgba(0,0,0,.06);--bubble:#fff;--glow1:rgba(0,122,255,.24);--glow2:rgba(175,82,222,.16);--hump:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 112 26' preserveAspectRatio='none'><path d='M0 26C20 26 26 0 56 0s36 26 56 26z' fill='%23ffffff' fill-opacity='.94'/></svg>");color-scheme:light}
:root[data-fx="off"]{--card:rgba(44,44,46,.94);--cardg:rgba(44,44,46,.94);--dlg:rgba(44,44,46,.97)}
:root[data-fx="off"] nav::before{background:#1c1c1e;-webkit-backdrop-filter:none;backdrop-filter:none}
:root[data-fx="off"] nav .ac{background:#1c1c1e}
:root[data-fx="off"][data-mode="light"]{--card:rgba(255,255,255,.96);--cardg:rgba(255,255,255,.96);--dlg:rgba(252,252,254,.98)}
:root[data-fx="off"][data-mode="light"] nav::before{background:#fff}
:root[data-fx="off"][data-mode="light"] nav .ac{background:#fff}
:root[data-fx="off"] *{-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
:root[data-an="off"] *{animation:none!important;transition:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(80% 45% at 12% -8%,var(--glow1),transparent 62%),radial-gradient(70% 40% at 105% 28%,var(--glow2),transparent 62%),radial-gradient(60% 40% at 0% 100%,var(--glow2),transparent 65%);transform:translateZ(0)}
main{max-width:640px;margin:0 auto;padding:16px 16px 120px}
.hd{display:flex;gap:10px;align-items:center;margin-bottom:12px}
.hd h1{flex:1;min-width:0}
h1{font:700 22px/1.15 -apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,system-ui,sans-serif;letter-spacing:-.3px;margin:6px 0;color:var(--tx)}
h1 input,h1 input:focus{width:100%;border:0;border-radius:0;background:transparent;color:inherit;font:inherit;letter-spacing:inherit;padding:0;outline:none;box-shadow:none}
h1 input::placeholder{color:var(--mu)}
h1 input{pointer-events:none;caret-color:transparent;-webkit-user-select:none;user-select:none}
.hb{display:flex;gap:8px;flex:none}
.hb button{width:38px;height:38px;border:1px solid var(--ln);border-radius:50%;background:var(--card);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);color:var(--tx);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.hb svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:max-content;max-width:calc(100% - 20px);z-index:40;display:flex;align-items:center;gap:6px;padding:7px;border-radius:999px}
nav::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;background:var(--navbg);border:1px solid var(--ln);-webkit-backdrop-filter:blur(22px) saturate(1.6);backdrop-filter:blur(22px) saturate(1.6);box-shadow:0 14px 30px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.08)}
nav .ac{position:absolute;right:7px;bottom:calc(100% + 12px);width:44px;height:44px;border-radius:50%;border:0;padding:0;display:flex;align-items:center;justify-content:center;color:var(--navic);background:var(--navbg);-webkit-backdrop-filter:blur(22px) saturate(1.6);backdrop-filter:blur(22px) saturate(1.6);box-shadow:inset 0 0 0 1px var(--ln),inset 0 1px 0 rgba(255,255,255,.2),0 10px 24px rgba(0,0,0,.3);cursor:pointer;transition:transform .35s cubic-bezier(.2,1.3,.3,1)}
nav .ac svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav .ac:active{transform:scale(.88)}
.av{flex:none;width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:700 20px/1 -apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,system-ui,sans-serif;background:linear-gradient(145deg,var(--ac),#5e5ce6);color:#fff;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.5),inset 0 4px 8px rgba(255,255,255,.3),0 4px 14px rgba(0,0,0,.3)}
nav .tb,nav .tm{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:none;color:var(--navic);display:flex;align-items:center;justify-content:center;padding:0;margin:0;cursor:pointer;transition:background .3s,color .3s,transform .35s cubic-bezier(.2,1.3,.3,1)}
nav .tb i{display:flex}
nav .tb svg,nav .tm svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
nav .tb svg{transition:stroke-width .3s}
nav .tb.on svg{stroke-width:2.6}
nav .tb:active,nav .tm:active{transform:scale(.88)}
nav .tb.on{background:var(--navon);color:var(--navonic);animation:dpop .45s cubic-bezier(.2,1.4,.3,1) both}
nav .tm{background:var(--navtm);box-shadow:inset 0 0 0 1px var(--ln);margin-left:2px}
@keyframes dpop{from{transform:scale(.7)}to{transform:scale(1)}}
.card{background:var(--cardg);border:1px solid var(--ln);border-radius:24px;padding:16px;margin-bottom:14px;-webkit-backdrop-filter:blur(24px) saturate(1.8);backdrop-filter:blur(24px) saturate(1.8);box-shadow:0 10px 32px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.14)}
.card.bal{background:linear-gradient(135deg,rgba(28,140,255,.92) 0%,rgba(11,79,216,.92) 100%);border:0;box-shadow:0 10px 26px rgba(10,132,255,.3),inset 0 1px 0 rgba(255,255,255,.3);color:#fff}
.card.bal .k{color:rgba(255,255,255,.8)}
.card.bal .bad{color:#ffd0cc}
.card.bal .good{color:#fff}
.card.bal .eye{background:rgba(255,255,255,.22);color:#fff}
.card.st-e{background:rgba(255,69,58,.16);border-color:rgba(255,69,58,.3)}
.card.st-i{background:rgba(10,132,255,.18);border-color:rgba(10,132,255,.34)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.two .card{margin:0}
.ic{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex:none;margin-bottom:8px;background:var(--fld);color:var(--tx)}
.st-e .ic{background:rgba(255,69,58,.25);color:#ff6b62}
.st-i .ic{background:rgba(10,132,255,.28);color:#4da3ff}
.k{font:500 12.5px/1.3 -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;color:var(--mu)}
.v{font:700 21px/1.25 -apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,system-ui,sans-serif;word-break:break-word}
.big{font-size:1.5em!important;margin-top:4px}
.card>b{display:block;font:600 17px/1.3 -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;color:var(--tx);margin-bottom:10px}
.row>b{font:600 17px/1.3 -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;color:var(--tx)}
.good{color:var(--good)}
.bad{color:var(--bad)}
.row{display:flex;justify-content:space-between;gap:8px;font-size:14px}
select,input{width:100%;min-width:0;max-width:100%;padding:12px 14px;border:0;border-radius:12px;background:var(--fld);color:var(--tx);font:500 15px/1.2 -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;box-shadow:none;outline:0}
select{-webkit-appearance:none;appearance:none;padding-right:36px;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1.5l5 5 5-5' fill='none' stroke='%238e8e93' stroke-width='2' stroke-linecap='round'/></svg>");background-repeat:no-repeat;background-position:right 14px center}
select option{background:#2c2c2e;color:#fff}
:root[data-mode="light"] select option{background:#fff;color:#000}
select:focus,input:focus{box-shadow:0 0 0 2px rgba(10,132,255,.7)}
::placeholder{color:var(--mu);opacity:.7}
.f{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.f>*{min-width:0}
.bar{height:6px;border-radius:6px;background:var(--trk);margin:6px 0 12px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac);border-radius:6px;transform-origin:left}
.bar i.o{background:var(--bad)}
.tx{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px 0;border-bottom:1px solid var(--ln)}
.tx:last-child,.rt:last-child{border-bottom:0}
.tx small{display:block;color:var(--mu);font-size:12.5px}
.tx b{font-weight:600;font-size:15px}
.tx button{border:0;background:none;color:var(--mu);font:inherit;font-size:22px;cursor:pointer}
.rt{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--ln)}
.rt .ic{margin:0}
.lg{display:flex;align-items:center;gap:10px;padding:6px 0 2px}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.lnk{border:0;background:none;color:var(--ac);font:inherit;font-size:14px;cursor:pointer}
.btn{width:100%;padding:14px;border:0;border-radius:14px;background:var(--ac);color:#fff;font:600 16px/1 -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;margin-top:10px;cursor:pointer;transition:transform .25s cubic-bezier(.2,.9,.25,1),opacity .2s}
.btn:active{transform:scale(.97);opacity:.8}
.note{font-size:12.5px;color:var(--mu);margin-top:8px}
.sc{overflow-x:auto}
svg rect{rx:5px;ry:5px;shape-rendering:auto}
table{font-size:13px}
.eye{flex:none;width:30px;height:30px;padding:0;border:0;border-radius:50%;background:var(--fld);color:var(--tx);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .25s cubic-bezier(.2,.9,.25,1)}
.eye:active{transform:scale(.88)}
.eye svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.4);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:20px;z-index:60;animation:fade .25s ease both}
.dlg{background:linear-gradient(145deg,rgba(255,255,255,.18),rgba(255,255,255,0) 55%),var(--dlg);-webkit-backdrop-filter:blur(26px) saturate(1.8);backdrop-filter:blur(26px) saturate(1.8);color:var(--tx);border:1px solid var(--ln);border-radius:24px;padding:20px 20px 0;max-width:340px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.12);animation:pop .45s cubic-bezier(.2,1.25,.3,1) both}
.dlg p{margin:0 0 14px;font:600 17px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif}
.dlg>p:first-child{text-align:center}
.dlg .r{display:flex;border-top:1px solid var(--ln);margin:0 -20px}
.dlg .r button{flex:1;padding:14px 4px;border:0;border-radius:0;background:none;color:var(--ac);font:600 16px/1 -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;cursor:pointer}
