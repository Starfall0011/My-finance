<style>
:root{--bg:#04140f;--card:rgba(20,80,62,.22);--cardg:linear-gradient(145deg,rgba(34,120,94,.30),rgba(6,36,28,.34));--dlg:rgba(8,40,31,.88);--fld:rgba(120,255,215,.09);--tx:#fff;--mu:#8fb3a8;--ac:#2ee6c5;--on:#03231c;--bad:#ff5a52;--good:#4ff0a8;--ln:rgba(120,255,215,.16);--trk:rgba(120,255,215,.16);--navbg:rgba(8,40,31,.55);--navic:rgba(255,255,255,.92);--navon:#2ee6c5;--navonic:#03231c;--navtm:rgba(120,255,215,.12);--bubble:#0b2e25;--glow1:rgba(22,130,98,.60);--glow2:rgba(46,230,197,.10);--hump:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 112 26' preserveAspectRatio='none'><path d='M0 26C20 26 26 0 56 0s36 26 56 26z' fill='%230b2e25' fill-opacity='.94'/></svg>");color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-mode="light"]{--bg:#eef2f9;--card:rgba(255,255,255,.92);--cardg:linear-gradient(145deg,#fff,rgba(255,255,255,.88));--dlg:rgba(250,250,252,.8);--fld:rgba(118,118,128,.12);--tx:#0f172a;--mu:#6c6c72;--ac:#19396a;--bad:#ff3b30;--good:#16a34a;--ln:rgba(30,60,120,.08);--trk:rgba(0,0,0,.1);--navbg:rgba(255,255,255,.12);--navic:#2c2c2e;--navon:#111;--navonic:#fff;--navtm:rgba(0,0,0,.06);--bubble:#fff;--glow1:rgba(25,57,106,.55);--glow2:rgba(25,57,106,.14);--hump:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 112 26' preserveAspectRatio='none'><path d='M0 26C20 26 26 0 56 0s36 26 56 26z' fill='%23ffffff' fill-opacity='.94'/></svg>");color-scheme:light}
:root[data-fx="off"]{--card:rgba(10,48,38,.94);--cardg:rgba(10,48,38,.94);--dlg:rgba(8,40,31,.97)}
:root[data-fx="off"] nav::before{background:#1c1c1e;-webkit-backdrop-filter:none;backdrop-filter:none}
:root[data-fx="off"] nav .ac{background:#1c1c1e}
:root[data-fx="off"][data-mode="light"]{--card:rgba(255,255,255,.96);--cardg:rgba(255,255,255,.96);--dlg:rgba(252,252,254,.98)}
:root[data-fx="off"][data-mode="light"] nav::before{background:#fff}
:root[data-fx="off"][data-mode="light"] nav .ac{background:#fff}
:root[data-fx="off"] *{-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
:root[data-an="off"] *{animation:none!important;transition:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(90% 50% at 15% -8%,var(--glow1),transparent 65%),radial-gradient(70% 40% at 105% 30%,var(--glow2),transparent 62%),radial-gradient(70% 45% at 0% 100%,var(--glow2),transparent 65%);transform:translateZ(0)}
main{max-width:640px;margin:0 auto;padding:16px 16px 120px}
.hd{display:flex;gap:10px;align-items:center;margin-bottom:12px}
.hd h1{flex:1;min-width:0}
h1{font:700 22px/1.15 -apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,system-ui,sans-serif;letter-spacing:-.3px;margin:6px 0;color:var(--tx)}
h1 input,h1 input:focus{width:100%;border:0;border-radius:0;background:transparent;color:inherit;font:inherit;letter-spacing:inherit;padding:0;outline:none;box-shadow:none}
h1 input::placeholder{color:var(--mu)}
h1 input{pointer-events:none;caret-color:transparent;-webkit-user-select:none;user-select:none}
.hb{display:flex;gap:8px;flex:none}
.hb button{width:38px;height:38px;border:1px solid var(--ln);border-radius:50%;background:var(--card);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);color:var(--tx);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.hb svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:max-content;max-width:calc(100% - 20px);z-index:40;display:flex;align-items:center;gap:6px;padding:7px;border-radius:999px}
nav::before{content:"";display:none;position:absolute;inset:0;z-index:-1;border-radius:inherit;background:var(--navbg);border:1px solid var(--ln);-webkit-backdrop-filter:blur(22px) saturate(1.6);backdrop-filter:blur(22px) saturate(1.6);box-shadow:0 14px 30px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.08)}
nav .ac{position:absolute;right:7px;bottom:calc(100% + 12px);width:44px;height:44px;border-radius:50%;border:0;padding:0;display:flex;align-items:center;justify-content:center;color:var(--navic);background:var(--navbg);-webkit-backdrop-filter:blur(22px) saturate(1.6);backdrop-filter:blur(22px) saturate(1.6);box-shadow:inset 0 0 0 1px var(--ln),inset 0 1px 0 rgba(255,255,255,.2),0 10px 24px rgba(0,0,0,.3);cursor:pointer;transition:transform .35s cubic-bezier(.2,1.3,.3,1)}
nav .ac svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav .ac:active{transform:scale(.88)}
.av{flex:none;width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:700 20px/1 -apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,system-ui,sans-serif;background:linear-gradient(145deg,var(--ac),#0a7a62);color:#fff;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.5),inset 0 4px 8px rgba(255,255,255,.3),0 4px 14px rgba(0,0,0,.3)}
nav .tb,nav .tm{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:none;color:var(--navic);display:flex;align-items:center;justify-content:center;padding:0;margin:0;cursor:pointer;transition:background .3s,color .3s,transform .35s cubic-bezier(.2,1.3,.3,1)}
nav .tb i{display:flex}
nav .tb svg,nav .tm svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
nav .tb svg{transition:stroke-width .3s}
nav .tb.on svg{stroke-width:2.6}
nav .tb:active,nav .tm:active{transform:scale(.88)}
nav .tb.on{background:var(--navon);color:var(--navonic);animation:dpop .45s cubic-bezier(.2,1.4,.3,1) both}
nav .tm{background:var(--navtm);box-shadow:inset 0 0 0 1px var(--ln);margin-left:2px}
@keyframes dpop{from{transform:scale(.7)}to{transform:scale(1)}}
.card{background:var(--cardg);border:1px solid var(--ln);border-radius:24px;padding:16px;margin-bottom:14px;-webkit-backdrop-filter:blur(24px) saturate(1.8);backdrop-filter:blur(24px) saturate(1.8);box-shadow:0 10px 32px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.14)}
.card.bal{background:linear-gradient(135deg,rgba(30,200,170,.95) 0%,rgba(8,100,80,.95) 100%);border:0;box-shadow:0 10px 26px rgba(46,230,197,.3),inset 0 1px 0 rgba(255,255,255,.3);color:#fff}
.card.bal .k{color:rgba(255,255,255,.8)}
.card.bal .bad{color:#ffd0cc}
.card.bal .good{color:#fff}
.card.bal .eye{background:rgba(255,255,255,.22);color:#fff}
.card.st-e{background:rgba(255,69,58,.16);border-color:rgba(255,69,58,.3)}
.card.st-i{background:rgba(46,230,197,.16);border-color:rgba(46,230,197,.32)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.two .card{margin:0}
.ic{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex:none;margin-bottom:8px;background:var(--fld);color:var(--tx)}
.st-e .ic{background:rgba(255,69,58,.25);color:#ff6b62}
.st-i .ic{background:rgba(46,230,197,.26);color:#4ff0a8}
.k{font:500 12.5px/1.3 -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;color:var(--mu)}
.v{font:700 21px/1.25 -apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,system-ui,sans-serif;word-break:break-word}
.big{font-size:1.5em!important;margin-top:4px}
.card>b{display:block;font:600 17px/1.3 -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;color:var(--tx);margin-bottom:10px}
.row>b{font:600 17px/1.3 -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;color:var(--tx)}
.good{color:var(--good)}
.bad{color:var(--bad)}
.row{display:flex;justify-content:space-between;gap:8px;font-size:14px}
select,input{width:100%;min-width:0;max-width:100%;padding:12px 14px;border:0;border-radius:12px;background:var(--fld);color:var(--tx);font:500 15px/1.2 -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;box-shadow:none;outline:0}
select{-webkit-appearance:none;appearance:none;padding-right:36px;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1.5l5 5 5-5' fill='none' stroke='%238e8e93' stroke-width='2' stroke-linecap='round'/></svg>");background-repeat:no-repeat;background-position:right 14px center}
select option{background:#2c2c2e;color:#fff}
:root[data-mode="light"] select option{background:#fff;color:#000}
select:focus,input:focus{box-shadow:0 0 0 2px rgba(46,230,197,.7)}
::placeholder{color:var(--mu);opacity:.7}
.f{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.f>*{min-width:0}
.bar{height:6px;border-radius:6px;background:var(--trk);margin:6px 0 12px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac);border-radius:6px;transform-origin:left}
.bar i.o{background:var(--bad)}
.tx{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px 0;border-bottom:1px solid var(--ln)}
.tx:last-child,.rt:last-child{border-bottom:0}
.tx small{display:block;color:var(--mu);font-size:12.5px}
.tx b{font-weight:600;font-size:15px}
.tx button{border:0;background:none;color:var(--mu);font:inherit;font-size:22px;cursor:pointer}
.rt{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--ln)}
.rt .ic{margin:0}
.lg{display:flex;align-items:center;gap:10px;padding:6px 0 2px}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.lnk{border:0;background:none;color:var(--ac);font:inherit;font-size:14px;cursor:pointer}
.btn{width:100%;padding:14px;border:0;border-radius:14px;background:var(--ac);color:#fff;font:600 16px/1 -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;margin-top:10px;cursor:pointer;transition:transform .25s cubic-bezier(.2,.9,.25,1),opacity .2s}
.btn:active{transform:scale(.97);opacity:.8}
.note{font-size:12.5px;color:var(--mu);margin-top:8px}
.sc{overflow-x:auto}
svg rect{rx:5px;ry:5px;shape-rendering:auto}
table{font-size:13px}
.eye{flex:none;width:30px;height:30px;padding:0;border:0;border-radius:50%;background:var(--fld);color:var(--tx);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .25s cubic-bezier(.2,.9,.25,1)}
.eye:active{transform:scale(.88)}
.eye svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.4);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:20px;z-index:60;animation:fade .25s ease both}
.dlg{background:linear-gradient(145deg,rgba(255,255,255,.18),rgba(255,255,255,0) 55%),var(--dlg);-webkit-backdrop-filter:blur(26px) saturate(1.8);backdrop-filter:blur(26px) saturate(1.8);color:var(--tx);border:1px solid var(--ln);border-radius:24px;padding:20px 20px 0;max-width:340px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.12);animation:pop .45s cubic-bezier(.2,1.25,.3,1) both}
.dlg p{margin:0 0 14px;font:600 17px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif}
.dlg>p:first-child{text-align:center}
.dlg .r{display:flex;border-top:1px solid var(--ln);margin:0 -20px}
.dlg .r button{flex:1;padding:14px 4px;border:0;border-radius:0;background:none;color:var(--ac);font:600 16px/1 -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;cursor:pointer}
.dlg .r button+button{border-left:1px solid var(--ln)}
.dlg .r button.d{color:var(--bad)}

["Home","Home","Lihat total aset, pemasukan, pengeluaran, grafik, dan transaksi terbaru pada periode yang dipilih. Ganti periode lewat pilihan di bagian atas.","See total assets, income, expenses, charts, and recent transactions for the selected period. Change the period with the selector at the top."],
["Transaksi","Transactions","Catat pengeluaran: pilih tanggal, kategori, jumlah, dan sumber dana (Rek. Bank, Tunai, E-Wallet, atau aset buatanmu), lalu ketuk Simpan. Ketuk × untuk menghapus transaksi.","Record an expense: pick the date, category, amount, and source (Bank Account, Cash, E-Wallet, or an asset you added), then tap Save. Tap × to delete a transaction."],
["Pemasukan","Income","Isi gaji periode ini dan pilih aset tujuannya, atau tambahkan pemasukan lain. Saldo aset yang dipilih ikut bertambah.","Enter this period's salary and choose which asset receives it, or add other income. The chosen asset's balance goes up accordingly."],
["Aset","Assets","Geser kartu dompet ke atas atau bawah untuk memilih aset.<br>Saldo akhir = saldo awal + pemasukan − pengeluaran.<br>Di detail aset kamu bisa mengubah warna kartu atau mengoreksi saldo akhir.<br>Aset baru ditambahkan di bagian bawah.","Swipe the wallet cards up or down to choose an asset.<br>Closing balance = opening balance + income − expenses.<br>In the asset details you can change the card color or correct the closing balance.<br>Add new assets at the bottom."],
["Transfer antar aset","Transfers between assets","Pindahkan uang dari satu aset ke aset lain di menu Aset. Transfer tidak dihitung sebagai pemasukan atau pengeluaran, hanya memindahkan saldo.","Move money from one asset to another in the Assets menu. A transfer is not counted as income or expenses; it only moves balances."],
["Anggaran","Budget","Atur batas anggaran tiap kategori untuk setiap periode, ubah warna kategori, dan tambah kategori baru. Batang berubah merah jika pengeluaran melewati anggaran. Opsi Nolkan, Pulihkan, dan Reset ada di bagian bawah menu ini.","Set a budget limit for each category per period, change category colors, and add new categories. The bar turns red when spending goes over budget. Reset numbers, Restore, and Reset data are at the bottom of this menu."],
["Periode","Periods","Satu periode biasanya satu bulan (contoh tanggal 1 sampai 31). Ubah tanggal mulai dan selesai di bagian atas, atau tambah periode berikutnya dari Ringkasan.<br>Catatan: tambah periode baru di paling bawah sebelum memulai di periode berikutnya.","A period is usually one month (for example the 1st to the 31st). Change the start and end dates at the top, or add the next period from Summary.<br>Note: add the new period at the very bottom before starting the next period."],
["Sembunyikan saldo","Hide balance","Ketuk ikon mata untuk menyembunyikan total aset dan selisih periode di Home, atau saldo di dompet.","Tap the eye icon to hide total assets and the period difference on Home, or the balance in the wallet."],
["Pengaturan dan akun","Settings and account","Ganti bahasa lewat ikon pengaturan di kanan atas. Di menu Akun kamu bisa mengubah nama, mengekspor atau mengimpor cadangan data, dan masuk untuk menyinkronkan data antar perangkat.","Change the language with the settings icon at the top right. In the Account menu you can change your name, export or import a data backup, and sign in to sync data across devices."],
["Cari, berulang, dan PDF","Search, recurring, and PDF","Di menu Transaksi, kolom pencarian dan pilihan kategori menyaring daftar transaksi. Kartu Transaksi berulang mencatat otomatis transaksi yang sama (misalnya cicilan) setiap bulan di tanggal yang sama, mulai dari tanggal pertama; transaksi hasilnya diberi tanda ↻. Di menu Akun, Ekspor PDF membuat laporan mutasi seperti mutasi rekening (setoran target di rentang itu ikut dicantumkan di bagian akhir) untuk rentang tanggal yang kamu pilih (bisa sebagian periode atau lebih dari satu periode): tanggal, keterangan, debit, kredit, dan saldo berjalan, lengkap dengan saldo awal dan saldo akhir.","In the Transactions menu, the search box and category picker filter the transaction list. The Recurring transactions card automatically records the same transaction (for example an installment) every month on the same day, starting from the first date; the resulting transactions are marked ↻. In the Account menu, Export PDF creates a bank-style statement for the date range you choose (part of a period or several periods): date, description, debit, credit, and running balance, with opening and closing balances."],
["Target","Goals","Tab Target mencatat target tabungan (misalnya dana darurat atau liburan) dan utang atau cicilan. Ketuk + Tambah target, isi nama, jenis, jumlah target, dan tenggat bila ada. Catat setoran atau pembayaran dengan tombol + Setor atau + Bayar; bilah kemajuan, sisa, dan jumlah yang perlu disisihkan per bulan dihitung otomatis. Saat menyetor atau membayar, pilih aset di kolom Dari aset agar saldo aset itu ikut berkurang (tidak dihitung sebagai pengeluaran). Pilih Tidak ada bila hanya ingin mencatat tanpa mengubah saldo aset.","The Goals tab tracks savings goals (such as an emergency fund or a vacation) and debts or installments. Tap + Add goal and enter a name, type, target amount, and a due date if any. Record deposits or payments with + Deposit or + Pay; the progress bar, remaining amount, and the amount to set aside each month are calculated automatically. When depositing or paying, pick an asset in the From asset field so its balance goes down (it is not counted as an expense). Choose None to only record it without changing any asset balance."],
["Target bersama","Shared goals","Target bisa dibagikan ke pasangan di perangkat lain. Masuk ke akun lebih dulu, lalu di kartu target ketuk Bagikan dan salin kodenya. Di perangkat pasangan (yang juga sudah masuk akun), buka menu Target, ketuk Gabung dengan kode, dan masukkan kodenya. Setoran dari kedua orang tampil di target yang sama beserta nama pencatatnya, dan tersinkron otomatis saat online. Hanya target itu yang dibagikan; aset, transaksi, dan data lain tetap pribadi. Siapa pun yang punya kodenya bisa melihat dan mengubah target, jadi berikan hanya ke pasangan.","Goals can be shared with a partner on another device. Sign in first, then tap Share on a goal card and copy the code. On your partner's device (also signed in), open the Goals tab, tap Join with code, and enter the code. Deposits from both of you appear on the same goal with the name of who recorded them, and sync automatically when online. Only that goal is shared; assets, transactions, and other data stay private. Anyone with the code can view and change the goal, so give it only to your partner."],
["Kunci PIN","PIN lock","Aktifkan PIN 4 atau 6 digit di Pengaturan. Aplikasi akan terkunci saat dibuka kembali atau setelah ditinggalkan lebih dari 30 detik. PIN hanya tersimpan di perangkat ini dan tidak ikut tersinkron. Jika lupa PIN, pilih Lupa PIN: PIN dan data di perangkat ini dihapus, dan data yang sudah tersinkron bisa diambil lagi dengan masuk ke akun.","Turn on a 4 or 6-digit PIN in Settings. The app locks when reopened or after being away for more than 30 seconds. The PIN is stored only on this device and is not synced. If you forget it, choose Forgot PIN: the PIN and data on this device are deleted, and synced data can be restored by signing in."],
["Tips","Tips","Data tersimpan di perangkat ini. Ekspor cadangan secara berkala, atau masuk ke akun agar data tersinkron.","Your data is stored on this device. Export a backup regularly, or sign in so your data syncs."]];
